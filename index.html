                description: '천연 부시 육수와 21가지 한방 향신료가 어우러진 삿포로 대표 향토 카레. 겉바속촉 구운 야채와 훈제 닭다리의 조화.',
                signatureDishes: ['부드러운 치킨 스프카레 (やわらかチキン野菜)'],
                phrases: [
                    { jp: '辛さは3番、ご飯にチーズトッピングで', romaji: 'Karasa wa sanban, gohan ni chizu toppingu de', ko: '맵기 3단계, 밥 위에 치즈 토핑으로 주세요' }
                ]
            }
        ];

        const DINING_PHRASEBOOK = [
            { category: '입장 & 인원', jp: '二人です (Futari desu)', ko: '두 명입니다.', tip: '손가락으로 인원수를 함께 보여주면 더 정확합니다.' },
            { category: '메뉴판 요청', jp: '韓国語のメニューはありますか？ (Kankokugo no menyu wa arimasu ka?)', ko: '한국어 메뉴판이 있나요?' },
            { category: '주문 시', jp: 'これとこれをください (Kore to kore o kudasai)', ko: '이것과 이것으로 주세요 (메뉴판 가리키며).' },
            { category: '추천 요청', jp: '一番人気は何ですか？ (Ichiban ninki wa nan desu ka?)', ko: '가장 인기 있는 메뉴는 무엇인가요?' },
            { category: '와사비 조절', jp: 'ワサビ抜きでお願いします (Wasabi nuki de onegaishimasu)', ko: '와사비 빼고 부탁드립니다.' },
            { category: '물/얼음물', jp: 'お冷をふたつお願いします (Ohiya o futatsu onegaishimasu)', ko: '시원한 물 두 잔 부탁합니다.' },
            { category: '계산 시', jp: 'お会計をお願いします (Okaikei o onegaishimasu)', ko: '계산 부탁드립니다 (손가락 X 표시 가능).' },
            { category: '식사 후 감사', jp: 'ごちそうさまでした (Gochisosama deshita)', ko: '잘 먹었습니다 (미소 지으며 점원에게).' }
        ];

        const speakJapanese = (text) => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text.split('(')[0]);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        };

        function App() {
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [selectedCity, setSelectedCity] = useState('전체');
            const [selectedCategory, setSelectedCategory] = useState('전체');
            const [searchKeyword, setSearchKeyword] = useState('');
            const [minRating, setMinRating] = useState(0);
            const [activeTab, setActiveTab] = useState('explore'); // 'explore' | 'phrases' | 'passport' | 'calc'
            const [selectedSpot, setSelectedSpot] = useState(null);
            const [showTaxiModal, setShowTaxiModal] = useState(false);
            const [toast, setToast] = useState('');
            const [copiedId, setCopiedId] = useState(null);

            // Yen Calculator State
            const [yenInput, setYenInput] = useState('1000');
            const yenRate = 8.95; // Approximate 100 Yen = 895 KRW

            // LocalStorage Bookmarks
            const [bookmarks, setBookmarks] = useState(() => {
                try {
                    const saved = localStorage.getItem('tabi_2030_bookmarks_v2');
                    return saved ? JSON.parse(saved) : ['tokyo-1', 'osaka-2'];
                } catch { return ['tokyo-1']; }
            });

            useEffect(() => {
                try {
                    localStorage.setItem('tabi_2030_bookmarks_v2', JSON.stringify(bookmarks));
                } catch (e) { console.error(e); }
            }, [bookmarks]);

            const toggleTheme = () => {
                setIsDarkMode(!isDarkMode);
                document.documentElement.classList.toggle('dark');
            };

            const triggerToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 2500);
            };

            const toggleBookmark = (id, e) => {
                if (e) e.stopPropagation();
                if (bookmarks.includes(id)) {
                    setBookmarks(bookmarks.filter(bId => bId !== id));
                    triggerToast('🔖 미식 여권에서 삭제되었습니다.');
                } else {
                    setBookmarks([...bookmarks, id]);
                    triggerToast('🌸 미식 여권에 저장되었습니다!');
                }
            };

            const filteredSpots = useMemo(() => {
                return JAPAN_GOURMET_DB.filter(spot => {
                    const matchCity = selectedCity === '전체' || spot.city === selectedCity;
                    const matchCategory = selectedCategory === '전체' || spot.category === selectedCategory;
                    const matchRating = spot.rating >= minRating;
                    const matchKeyword = !searchKeyword.trim() || 
                        spot.name.toLowerCase().includes(searchKeyword.toLowerCase()) ||
                        spot.jpName.toLowerCase().includes(searchKeyword.toLowerCase()) ||
                        spot.district.toLowerCase().includes(searchKeyword.toLowerCase()) ||
                        spot.tags.some(t => t.toLowerCase().includes(searchKeyword.toLowerCase()));

                    return matchCity && matchCategory && matchRating && matchKeyword;
                });
            }, [selectedCity, selectedCategory, searchKeyword, minRating]);

            const savedSpotObjects = useMemo(() => {
                return JAPAN_GOURMET_DB.filter(spot => bookmarks.includes(spot.id));
            }, [bookmarks]);

            const copyToClipboard = (text, id) => {
                navigator.clipboard.writeText(text);
                setCopiedId(id);
                triggerToast('📋 일본어 주소가 클립보드에 복사되었습니다.');
                setTimeout(() => setCopiedId(null), 2000);
            };

            return (
                <div className={`max-w-4xl mx-auto px-4 sm:px-6 pt-6 relative z-10 min-h-screen flex flex-col ${isDarkMode ? 'dark' : 'light'}`}>
                    
                    {/* Toast Alert Notification */}
                    {toast && (
                        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-night-surface dark:bg-night-surface light:bg-white border border-gold/40 text-washi dark:text-washi light:text-stone-900 text-xs sm:text-sm font-bold px-5 py-3 rounded-full shadow-neon-gold backdrop-blur-xl flex items-center space-x-2.5 animate-bounce">
                            <i className="fa-solid fa-sparkles text-gold"></i>
                            <span>{toast}</span>
                        </div>
                    )}

                    <header className="flex items-center justify-between pb-6 border-b border-stone-800/60 dark:border-stone-800/60 light:border-stone-200 mb-8">
                        <div className="flex items-center space-x-3 cursor-pointer group" onClick={() => { setActiveTab('explore'); setSelectedCity('전체'); }}>
                            <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-vermilion via-red-600 to-amber-600 text-white flex items-center justify-center shadow-neon-vermilion group-hover:scale-105 active-scale">
                                <i className="fa-solid fa-torii-gate text-lg"></i>
                            </div>
                            <div>
                                <div className="flex items-center space-x-2">
                                    <span className="font-black text-xl tracking-tight text-washi dark:text-washi light:text-stone-900 font-serif">일여방</span>
                                    <span className="text-[10px] font-bold tracking-widest text-gold bg-gold-soft border border-gold/30 px-2 py-0.5 rounded-full uppercase">
                                        日旅食 3.0
                                    </span>
                                </div>
                                <p className="text-[11px] text-stone-400 dark:text-stone-400 light:text-stone-500 font-medium">일본 미식 여행 실시간 가이드</p>
                            </div>
                        </div>

                        {/* Top Controls: Theme Toggle & Quick Badge */}
                        <div className="flex items-center space-x-2">
                            <button
                                onClick={toggleTheme}
                                className="w-10 h-10 rounded-xl bg-stone-900/80 dark:bg-stone-900/80 light:bg-stone-100 text-gold border border-stone-800 dark:border-stone-800 light:border-stone-200 flex items-center justify-center active-scale"
                                title="테마 변경 (다크/라이트)"
                            >
                                <i className={`fa-solid ${isDarkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-600'}`}></i>
                            </button>

                            <button
                                onClick={() => setActiveTab('passport')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-2 active-scale ${
                                    activeTab === 'passport'
                                        ? 'bg-vermilion text-white shadow-neon-vermilion'
                                        : 'bg-stone-900/80 dark:bg-stone-900/80 light:bg-stone-100 text-stone-300 dark:text-stone-300 light:text-stone-700 border border-stone-800 dark:border-stone-800 light:border-stone-200'
                                }`}
                            >
                                <i className="fa-solid fa-passport"></i>
                                <span className="hidden sm:inline">미식 여권</span>
                                {bookmarks.length > 0 && (
                                    <span className="px-1.5 py-0.2 text-[10px] rounded-full bg-gold text-night font-black">
                                        {bookmarks.length}
                                    </span>
                                )}
                            </button>
                        </div>
                    </header>

                    {activeTab === 'explore' && (
                        <div className="space-y-8 animate-slide-up">
                            
                            {/* Trendy Hero Banner */}
                            <div className="relative overflow-hidden rounded-3xl glass-card p-6 sm:p-10 border border-stone-800/80">
                                <div className="absolute -top-8 -right-8 text-[160px] font-serif font-black text-white/5 dark:text-white/5 light:text-black/5 pointer-events-none select-none">
                                    食
                                </div>
                                <div className="relative z-10 max-w-xl space-y-3">
                                    <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-vermilion-soft border border-vermilion/30 text-vermilion text-xs font-bold">
                                        <i className="fa-solid fa-fire text-vermilion"></i>
                                        <span>2030 JAPAN GOURMET CURATION</span>
                                    </div>
                                    <h1 className="text-3xl sm:text-4xl font-black text-washi dark:text-washi light:text-stone-900 leading-tight tracking-tight font-serif">
                                        일본 미식 여행,<br />
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-gold-light via-gold to-amber-200">
                                            실시간 구글 4.5+ 노포 탐색
                                        </span>
                                    </h1>
                                    <p className="text-xs sm:text-sm text-stone-400 dark:text-stone-400 light:text-stone-600 leading-relaxed pt-1">
                                        현지 일본인 리뷰로 검증된 맛집. 1초 일어 음성 지원, 택시 기사님 전용 빅폰트 화면, 미식 여권 보관함이 준비되어 있습니다.
                                    </p>
                                </div>
                            </div>

                            {/* Search & Filter Dashboard */}
                            <div className="glass-card p-5 sm:p-7 rounded-3xl space-y-6">
                                
                                {/* Keyword Search Bar */}
                                <div className="relative">
                                    <i className="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-stone-500"></i>
                                    <input 
                                        type="text"
                                        value={searchKeyword}
                                        onChange={e => setSearchKeyword(e.target.value)}
                                        placeholder="도시, 식당 이름, 시그니처 메뉴, 태그 검색 (예: 신주쿠, 츠케멘, 스시)"
                                        className="w-full bg-stone-900/90 dark:bg-stone-900/90 light:bg-stone-100 border border-stone-800 dark:border-stone-800 light:border-stone-200 rounded-2xl py-3.5 pl-11 pr-10 text-sm text-washi dark:text-washi light:text-stone-900 placeholder:text-stone-500 focus:outline-none focus:border-vermilion focus:ring-1 focus:ring-vermilion/30 transition-all font-medium"
                                    />
                                    {searchKeyword && (
                                        <button onClick={() => setSearchKeyword('')} className="absolute right-4 top-1/2 -translate-y-1/2 text-stone-500 hover:text-stone-300">
                                            <i className="fa-solid fa-circle-xmark"></i>
                                        </button>
                                    )}
                                </div>

                                {/* City Chips Filter */}
                                <div className="space-y-2">
                                    <span className="text-xs font-bold text-stone-400 dark:text-stone-400 light:text-stone-500 tracking-wider uppercase block">
                                        <i className="fa-solid fa-location-dot text-vermilion mr-1.5"></i> 여행 지역 선택
                                    </span>
                                    <div className="flex flex-wrap gap-2">
                                        {['전체', '도쿄', '오사카', '교토', '후쿠오카', '삿포로'].map(c => (
                                            <button
                                                key={c}
                                                onClick={() => setSelectedCity(c)}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all active-scale ${
                                                    selectedCity === c
                                                        ? 'bg-vermilion text-white shadow-neon-vermilion scale-105'
                                                        : 'bg-stone-900/80 dark:bg-stone-900/80 light:bg-stone-100 text-stone-400 dark:text-stone-400 light:text-stone-600 border border-stone-800 dark:border-stone-800 light:border-stone-200'
                                                }`}
                                            >
                                                {c}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Category Chips Filter */}
                                <div className="space-y-2">
                                    <span className="text-xs font-bold text-stone-400 dark:text-stone-400 light:text-stone-500 tracking-wider uppercase block">
                                        <i className="fa-solid fa-utensils text-gold mr-1.5"></i> 미식 카테고리
                                    </span>
                                    <div className="flex flex-wrap gap-2">
                                        {[
                                            { name: '전체', icon: 'fa-globe' },
                                            { name: '라멘', icon: 'fa-bowl-food' },
                                            { name: '스시', icon: 'fa-fish' },
                                            { name: '돈카츠', icon: 'fa-drumstick-bite' },
                                            { name: '이자카야', icon: 'fa-beer-mug-empty' },
                                            { name: '타코야키', icon: 'fa-circle-dot' },
                                            { name: '오코노미야키', icon: 'fa-stroopwafel' },
                                            { name: '디저트', icon: 'fa-mug-hot' },
                                            { name: '모츠나베', icon: 'fa-fire-burner' },
                                            { name: '카레', icon: 'fa-pepper-hot' }
                                        ].map(cat => (
                                            <button
                                                key={cat.name}
                                                onClick={() => setSelectedCategory(cat.name)}
                                                className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 active-scale ${
                                                    selectedCategory === cat.name
                                                        ? 'bg-gold text-night font-extrabold shadow-neon-gold scale-105'
                                                        : 'bg-stone-900/80 dark:bg-stone-900/80 light:bg-stone-100 text-stone-400 dark:text-stone-400 light:text-stone-600 border border-stone-800 dark:border-stone-800 light:border-stone-200'
                                                }`}
                                            >
                                                <i className={`fa-solid ${cat.icon}`}></i>
                                                <span>{cat.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Rating Filter Bar */}
                                <div className="flex items-center justify-between pt-3 border-t border-stone-800/80 dark:border-stone-800/80 light:border-stone-200 text-xs">
                                    <span className="text-stone-400 dark:text-stone-400 light:text-stone-600 font-semibold">최소 구글 평점:</span>
                                    <div className="flex items-center space-x-1.5">
                                        {[0, 4.5, 4.7, 4.8].map(r => (
                                            <button
                                                key={r}
                                                onClick={() => setMinRating(r)}
                                                className={`px-2.5 py-1 rounded-lg font-bold border transition-all ${
                                                    minRating === r
                                                        ? 'bg-amber-500/20 text-amber-300 border-amber-500/50'
                                                        : 'bg-stone-900 dark:bg-stone-900 light:bg-stone-100 text-stone-500 border-stone-800 dark:border-stone-800 light:border-stone-200'
                                                }`}
                                            >
                                                {r === 0 ? '전체' : `★ ${r}+`}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                            </div>

                            <div className="space-y-4">
                                <div className="flex items-center justify-between text-xs text-stone-400 px-1">
                                    <span className="font-bold tracking-wider">
                                        검색 결과 <strong className="text-gold">{filteredSpots.length}</strong>곳
                                    </span>
                                    <span className="text-[11px] text-stone-500">Google Real-Time Certified Spots</span>
                                </div>

                                {filteredSpots.length === 0 ? (
                                    <div className="glass-card rounded-3xl p-12 text-center space-y-4">
                                        <i className="fa-solid fa-circle-exclamation text-4xl text-stone-600"></i>
                                        <p className="text-sm text-stone-400">조건에 일치하는 일본 맛집을 찾지 못했습니다.</p>
                                        <button 
                                            onClick={() => { setSelectedCity('전체'); setSelectedCategory('전체'); setSearchKeyword(''); setMinRating(0); }}
                                            className="px-5 py-2.5 bg-vermilion text-white text-xs font-bold rounded-xl shadow-neon-vermilion"
                                        >
                                            필터 초기화
                                        </button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {filteredSpots.map((spot) => {
                                            const isSaved = bookmarks.includes(spot.id);
                                            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${spot.name} ${spot.address}`)}`;

                                            return (
                                                <div 
                                                    key={spot.id}
                                                    onClick={() => setSelectedSpot(spot)}
                                                    className="glass-card rounded-3xl p-5 flex flex-col justify-between cursor-pointer group relative overflow-hidden"
                                                >
                                                    <div>
                                                        {/* Header Pill & Heart */}
                                                        <div className="flex items-start justify-between gap-2 mb-2">
                                                            <div className="flex items-center space-x-1.5">
                                                                <span className="text-[10px] font-black px-2.5 py-0.5 rounded-md bg-stone-800 dark:bg-stone-800 light:bg-stone-200 text-stone-300 dark:text-stone-300 light:text-stone-700">
                                                                    {spot.city} • {spot.district}
                                                                </span>
                                                                {spot.michelin && (
                                                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-red-950/80 text-red-400 border border-red-800/60">
                                                                        <i className="fa-solid fa-award mr-1"></i>미슐랭
                                                                    </span>
                                                                )}
                                                            </div>

                                                            <button
                                                                onClick={(e) => toggleBookmark(spot.id, e)}
                                                                className={`w-9 h-9 rounded-full flex items-center justify-center transition-colors active-scale ${
                                                                    isSaved 
                                                                        ? 'bg-vermilion/20 text-vermilion border border-vermilion/40' 
                                                                        : 'bg-stone-900 dark:bg-stone-900 light:bg-stone-100 text-stone-500 hover:text-stone-300 border border-stone-800 dark:border-stone-800 light:border-stone-200'
                                                                }`}
                                                                title={isSaved ? '북마크 취소' : '북마크 추가'}
                                                            >
                                                                <i className={`fa-solid fa-heart ${isSaved ? 'text-vermilion' : ''}`}></i>
                                                            </button>
                                                        </div>

                                                        {/* Spot Title & Japanese Name */}
                                                        <h3 className="text-lg font-bold text-washi dark:text-washi light:text-stone-900 group-hover:text-gold transition-colors font-serif leading-snug">
                                                            {spot.name}
                                                        </h3>
                                                        <p className="text-xs text-stone-500 font-serif mb-3">{spot.jpName}</p>

                                                        {/* Rating & Price */}
                                                        <div className="flex items-center space-x-3 mb-3 text-xs">
                                                            <div className="flex items-center bg-amber-500/15 border border-amber-500/30 px-2.5 py-1 rounded-xl text-amber-400 font-extrabold">
                                                                <i className="fa-solid fa-star text-amber-400 mr-1.5"></i>
                                                                <span>{spot.rating.toFixed(1)}</span>
                                                            </div>
                                                            <span className="text-stone-400 font-medium">리뷰 {spot.reviewCount.toLocaleString()}개</span>
                                                            <span className="text-stone-400 font-semibold bg-stone-900 dark:bg-stone-900 light:bg-stone-100 px-2 py-0.5 rounded-md border border-stone-800 dark:border-stone-800 light:border-stone-200">
                                                                {spot.price}
                                                            </span>
                                                        </div>

                                                        {/* Description */}
                                                        <p className="text-xs text-stone-400 dark:text-stone-400 light:text-stone-600 leading-relaxed line-clamp-2 mb-3">
                                                            {spot.description}
                                                        </p>

                                                        {/* Tags */}
                                                        <div className="flex flex-wrap gap-1.5 mb-4">
                                                            {spot.tags.map((tag, tIdx) => (
                                                                <span key={tIdx} className="text-[10px] text-stone-400 dark:text-stone-400 light:text-stone-600 bg-stone-900/90 dark:bg-stone-900/90 light:bg-stone-100 border border-stone-800 dark:border-stone-800 light:border-stone-200 px-2 py-0.5 rounded-md">
                                                                    #{tag}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>

                                                    {/* Card Actions */}
                                                    <div className="pt-3 border-t border-stone-800/80 dark:border-stone-800/80 light:border-stone-200 flex items-center justify-between gap-2 text-xs">
                                                        <button 
                                                            onClick={(e) => { e.stopPropagation(); speakJapanese(spot.jpName); }}
                                                            className="p-2.5 rounded-xl bg-stone-900 dark:bg-stone-900 light:bg-stone-100 hover:bg-stone-800 text-stone-300 dark:text-stone-300 light:text-stone-700 border border-stone-800 dark:border-stone-800 light:border-stone-200 active-scale"
                                                            title="일본어 이름 오디오 발음 듣기"
                                                        >
                                                            <i className="fa-solid fa-volume-high text-gold"></i>
                                                        </button>

                                                        <button
                                                            onClick={(e) => { e.stopPropagation(); copyToClipboard(spot.jpAddress, spot.id); }}
                                                            className="flex-1 py-2.5 px-3 rounded-xl bg-stone-900 dark:bg-stone-900 light:bg-stone-100 hover:bg-stone-800 text-stone-300 dark:text-stone-300 light:text-stone-700 font-semibold border border-stone-800 dark:border-stone-800 light:border-stone-200 flex items-center justify-center space-x-1.5 transition-colors active-scale"
                                                        >
                                                            <i className="fa-regular fa-copy text-stone-500"></i>
                                                            <span>{copiedId === spot.id ? '복사 완료' : '일어 주소 복사'}</span>
                                                        </button>

                                                        <a
                                                            href={mapUrl}
                                                            target="_blank"
                                                            rel="noreferrer"
                                                            onClick={(e) => e.stopPropagation()}
                                                            className="flex-1 py-2.5 px-3 rounded-xl bg-vermilion hover:bg-vermilion-hover text-white font-bold flex items-center justify-center space-x-1.5 shadow-neon-vermilion transition-colors active-scale"
                                                        >
                                                            <span>구글 맵</span>
                                                            <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                        </a>
                                                    </div>

                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>

                        </div>
                    )}

                    {activeTab === 'phrases' && (
                        <div className="space-y-6 animate-slide-up">
                            <div className="glass-card rounded-3xl p-6 sm:p-8 space-y-3">
                                <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-gold-soft border border-gold/30 text-gold text-xs font-semibold">
                                    <i className="fa-solid fa-language"></i>
                                    <span>JAPANESE DINING HELPER</span>
                                </div>
                                <h2 className="text-2xl font-bold text-washi dark:text-washi light:text-stone-900 font-serif">일본 현지 식당 필수 회화 가이드</h2>
                                <p className="text-xs text-stone-400 dark:text-stone-400 light:text-stone-600 leading-relaxed">
                                    스피커 아이콘을 누르면 브라우저의 원어민 일본어 오디오 발음이 재생됩니다. 식당 점원에게 직접 보여주거나 들려주세요.
                                </p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                {DINING_PHRASEBOOK.map((phrase, pIdx) => (
                                    <div key={pIdx} className="glass-card rounded-2xl p-5 space-y-3 border border-stone-800 dark:border-stone-800 light:border-stone-200">
                                        <div className="flex items-center justify-between">
                                            <span className="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-gold-soft text-gold border border-gold/30">
                                                {phrase.category}
                                            </span>
                                            <button 
                                                onClick={() => speakJapanese(phrase.jp)}
                                                className="w-8 h-8 rounded-full bg-stone-900 dark:bg-stone-900 light:bg-stone-100 hover:bg-gold text-gold hover:text-night border border-gold/30 flex items-center justify-center transition-all active-scale"
                                                title="발음 듣기"
                                            >
                                                <i className="fa-solid fa-volume-high text-xs"></i>
                                            </button>
                                        </div>

                                        <p className="text-base font-extrabold text-washi dark:text-washi light:text-stone-900 font-serif leading-snug">{phrase.jp}</p>
                                        <p className="text-xs text-vermilion font-bold">{phrase.ko}</p>
                                        <p className="text-[11px] text-stone-400 dark:text-stone-400 light:text-stone-600 bg-stone-900/80 dark:bg-stone-900/80 light:bg-stone-100 p-2.5 rounded-xl border border-stone-800/80 dark:border-stone-800/80 light:border-stone-200">
                                            💡 {phrase.tip}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {activeTab === 'passport' && (
                        <div className="space-y-6 animate-slide-up">
                            <div className="glass-card rounded-3xl p-6 sm:p-8 space-y-3 border border-gold/30">
                                <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-gold-soft border border-gold/30 text-gold text-xs font-semibold">
                                    <i className="fa-solid fa-stamp"></i>
                                    <span>GOURMET PASSPORT</span>
                                </div>
                                <h2 className="text-2xl font-bold text-washi dark:text-washi light:text-stone-900 font-serif">나의 일본 미식 여권</h2>
                                <p className="text-xs text-stone-400 dark:text-stone-400 light:text-stone-600">
                                    총 <strong className="text-gold font-bold">{savedSpotObjects.length}곳</strong>의 레스토랑이 내 보관함에 저장되어 있습니다.
                                </p>
                            </div>

                            {savedSpotObjects.length === 0 ? (
                                <div className="glass-card rounded-3xl p-12 text-center space-y-4">
                                    <i className="fa-solid fa-passport text-4xl text-stone-600"></i>
                                    <p className="text-sm text-stone-400">아직 저장한 미식 스폿이 없습니다.</p>
                                    <button
                                        onClick={() => setActiveTab('explore')}
                                        className="px-5 py-2.5 bg-gold text-night font-bold text-xs rounded-xl shadow-neon-gold active-scale"
                                    >
                                        맛집 탐색하러 가기
                                    </button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {savedSpotObjects.map((spot) => (
                                        <div key={spot.id} className="glass-card rounded-3xl p-5 space-y-4">
                                            <div className="flex items-start justify-between">
                                                <div>
                                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-stone-800 text-stone-300">
                                                        {spot.city} • {spot.district}
                                                    </span>
                                                    <h3 className="text-lg font-bold text-washi dark:text-washi light:text-stone-900 font-serif mt-1">{spot.name}</h3>
                                                    <p className="text-xs text-stone-500 font-serif">{spot.jpName}</p>
                                                </div>
                                                <button
                                                    onClick={(e) => toggleBookmark(spot.id, e)}
                                                    className="text-vermilion p-2 hover:bg-vermilion/10 rounded-full active-scale"
                                                >
                                                    <i className="fa-solid fa-heart"></i>
                                                </button>
                                            </div>

                                            <div className="text-xs text-stone-400 dark:text-stone-400 light:text-stone-600 space-y-1 bg-stone-900/80 dark:bg-stone-900/80 light:bg-stone-100 p-3 rounded-2xl border border-stone-800 dark:border-stone-800 light:border-stone-200">
                                                <p>📍 {spot.jpAddress}</p>
                                                <p>⏰ {spot.hours}</p>
                                            </div>

                                            <div className="flex items-center space-x-2 pt-1 text-xs">
                                                <button
                                                    onClick={() => { setSelectedSpot(spot); setShowTaxiModal(true); }}
                                                    className="flex-1 py-2.5 bg-stone-900 dark:bg-stone-900 light:bg-stone-100 hover:bg-stone-800 text-gold font-bold rounded-xl border border-stone-800 dark:border-stone-800 light:border-stone-200 flex items-center justify-center space-x-1 active-scale"
                                                >
                                                    <i className="fa-solid fa-taxi"></i>
                                                    <span>택시 보드</span>
                                                </button>
                                                <a
                                                    href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${spot.name} ${spot.address}`)}`}
                                                    target="_blank"
                                                    rel="noreferrer"
                                                    className="flex-1 py-2.5 bg-vermilion text-white font-bold rounded-xl text-center shadow-neon-vermilion active-scale"
                                                >
                                                    구글 맵 연결
                                                </a>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'calc' && (
                        <div className="space-y-6 animate-slide-up">
                            <div className="glass-card rounded-3xl p-6 sm:p-8 space-y-4">
                                <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-gold-soft border border-gold/30 text-gold text-xs font-semibold">
                                    <i className="fa-solid fa-calculator"></i>
                                    <span>YEN TO KRW CONVERTER</span>
                                </div>
                                <h2 className="text-2xl font-bold text-washi dark:text-washi light:text-stone-900 font-serif">엔화 ↔ 원화 1초 자동 계산기</h2>
                                <p className="text-xs text-stone-400">기준 환율 약 100엔 = 895원 적용</p>

                                {/* Calculator Input Form */}
                                <div className="space-y-4 pt-2">
                                    <div>
                                        <label className="text-xs font-bold text-stone-400 block mb-1.5">일본 엔화 (엔, ¥)</label>
                                        <div className="relative">
                                            <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gold font-bold text-lg">¥</span>
                                            <input 
                                                type="number"
                                                value={yenInput}
                                                onChange={e => setYenInput(e.target.value)}
                                                className="w-full bg-stone-900 dark:bg-stone-900 light:bg-stone-100 border border-stone-800 dark:border-stone-800 light:border-stone-200 rounded-2xl py-3.5 pl-10 pr-4 text-xl font-bold text-washi dark:text-washi light:text-stone-900 focus:outline-none focus:border-gold"
                                            />
                                        </div>
                                    </div>

                                    <div className="p-4 rounded-2xl bg-gold-soft border border-gold/30 text-center space-y-1">
                                        <span className="text-xs text-stone-400 block">예상 원화 결제 금액</span>
                                        <p className="text-3xl font-black text-gold font-serif">
                                            ₩ {Math.round((parseFloat(yenInput) || 0) * (yenRate / 10)).toLocaleString()} 원
                                        </p>
                                    </div>

                                    {/* Quick Yen Buttons */}
                                    <div className="grid grid-cols-4 gap-2 pt-2">
                                        {[500, 1000, 3000, 5000].map(val => (
                                            <button
                                                key={val}
                                                onClick={() => setYenInput(val.toString())}
                                                className="py-2.5 rounded-xl bg-stone-900 dark:bg-stone-900 light:bg-stone-100 text-stone-300 dark:text-stone-300 light:text-stone-700 text-xs font-bold border border-stone-800 dark:border-stone-800 light:border-stone-200 active-scale"
                                            >
                                                + ¥{val.toLocaleString()}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedSpot && !showTaxiModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 animate-slide-up" onClick={() => setSelectedSpot(null)}>
                            <div className="glass-card max-w-lg w-full max-h-[90vh] overflow-y-auto rounded-3xl p-6 sm:p-8 space-y-6 border border-gold/40 shadow-glass-dark relative" onClick={e => e.stopPropagation()}>
                                
                                <button 
                                    onClick={() => setSelectedSpot(null)}
                                    className="absolute top-5 right-5 w-9 h-9 rounded-full bg-stone-900 text-stone-400 hover:text-white border border-stone-800 flex items-center justify-center active-scale"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                <div>
                                    <span className="text-xs font-bold text-gold bg-gold-soft px-2.5 py-1 rounded-md border border-gold/30">
                                        {selectedSpot.city} • {selectedSpot.district}
                                    </span>
                                    <h2 className="text-2xl font-extrabold text-washi dark:text-washi light:text-stone-900 font-serif mt-2">{selectedSpot.name}</h2>
                                    <div className="flex items-center space-x-2 mt-1">
                                        <p className="text-sm text-stone-400 font-serif">{selectedSpot.jpName}</p>
                                        <button onClick={() => speakJapanese(selectedSpot.jpName)} className="text-gold text-xs p-1 active-scale">
                                            <i className="fa-solid fa-volume-high"></i>
                                        </button>
                                    </div>
                                </div>

                                {/* Spot Info Grid */}
                                <div className="grid grid-cols-2 gap-3 text-xs">
                                    <div className="bg-stone-900/90 dark:bg-stone-900/90 light:bg-stone-100 p-3 rounded-2xl border border-stone-800 dark:border-stone-800 light:border-stone-200">
                                        <span className="text-stone-500 block mb-0.5">구글 평점</span>
                                        <span className="text-amber-400 font-bold text-sm">★ {selectedSpot.rating} ({selectedSpot.reviewCount}개)</span>
                                    </div>
                                    <div className="bg-stone-900/90 dark:bg-stone-900/90 light:bg-stone-100 p-3 rounded-2xl border border-stone-800 dark:border-stone-800 light:border-stone-200">
                                        <span className="text-stone-500 block mb-0.5">예산 대</span>
                                        <span className="text-washi dark:text-washi light:text-stone-900 font-bold text-sm">{selectedSpot.price}</span>
                                    </div>
                                </div>

                                {/* Hours & Address */}
                                <div className="space-y-2 text-xs text-stone-300 dark:text-stone-300 light:text-stone-700">
                                    <div className="bg-stone-900/90 dark:bg-stone-900/90 light:bg-stone-100 p-3.5 rounded-2xl border border-stone-800 dark:border-stone-800 light:border-stone-200 space-y-1">
                                        <p className="font-bold text-stone-400">⏰ 영업시간</p>
                                        <p>{selectedSpot.hours}</p>
                                    </div>

                                    <div className="bg-stone-900/90 dark:bg-stone-900/90 light:bg-stone-100 p-3.5 rounded-2xl border border-stone-800 dark:border-stone-800 light:border-stone-200 space-y-1">
                                        <div className="flex items-center justify-between">
                                            <p className="font-bold text-stone-400">📍 현지 일어 주소</p>
                                            <button 
                                                onClick={() => copyToClipboard(selectedSpot.jpAddress, 'modal-addr')}
                                                className="text-gold font-bold hover:underline"
                                            >
                                                복사
                                            </button>
                                        </div>
                                        <p className="text-washi dark:text-washi light:text-stone-900 font-serif">{selectedSpot.jpAddress}</p>
                                    </div>
                                </div>

                                {/* Signature Menu */}
                                <div className="space-y-2">
                                    <h4 className="text-xs font-bold text-stone-400 uppercase tracking-wider">대표 시그니처 메뉴</h4>
                                    <div className="flex flex-wrap gap-2">
                                        {selectedSpot.signatureDishes.map((dish, dIdx) => (
                                            <span key={dIdx} className="text-xs bg-gold-soft text-gold px-3 py-1.5 rounded-xl border border-gold/30 font-semibold">
                                                {dish}
                                            </span>
                                        ))}
                                    </div>
                                </div>

                                {/* Ordering Phrases */}
                                {selectedSpot.phrases && selectedSpot.phrases.length > 0 && (
                                    <div className="space-y-2">
                                        <h4 className="text-xs font-bold text-stone-400 uppercase tracking-wider">이 매장 추천 주문 한마디</h4>
                                        <div className="space-y-2">
                                            {selectedSpot.phrases.map((ph, phIdx) => (
                                                <div key={phIdx} className="bg-stone-900/90 dark:bg-stone-900/90 light:bg-stone-100 p-3.5 rounded-2xl border border-stone-800 dark:border-stone-800 light:border-stone-200 flex items-start justify-between gap-2">
                                                    <div>
                                                        <p className="text-xs font-bold text-washi dark:text-washi light:text-stone-900 font-serif">{ph.jp}</p>
                                                        <p className="text-[11px] text-vermilion mt-0.5">{ph.ko}</p>
                                                    </div>
                                                    <button onClick={() => speakJapanese(ph.jp)} className="text-gold p-1.5 shrink-0 active-scale">
                                                        <i className="fa-solid fa-volume-high"></i>
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Modal Footer Actions */}
                                <div className="pt-2 flex items-center gap-2">
                                    <button
                                        onClick={() => setShowTaxiModal(true)}
                                        className="py-3 px-4 bg-stone-900 dark:bg-stone-900 light:bg-stone-100 text-gold text-xs font-bold rounded-2xl border border-stone-800 dark:border-stone-800 light:border-stone-200 flex items-center space-x-1.5 active-scale"
                                    >
                                        <i className="fa-solid fa-taxi"></i>
                                        <span>택시 보드</span>
                                    </button>

                                    <a
                                        href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${selectedSpot.name} ${selectedSpot.address}`)}`}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="flex-1 py-3 px-4 bg-vermilion hover:bg-vermilion-hover text-white text-xs font-bold rounded-2xl text-center shadow-neon-vermilion flex items-center justify-center space-x-2 active-scale"
                                    >
                                        <span>구글 맵으로 길찾기</span>
                                        <i className="fa-solid fa-arrow-up-right-from-square"></i>
                                    </a>
                                </div>

                            </div>
                        </div>
                    )}

                    {/* TAXI DRIVER DISPLAY BOARD OVERLAY */}
                    {showTaxiModal && selectedSpot && (
                        <div className="fixed inset-0 z-50 bg-black flex flex-col justify-between p-8 text-center animate-slide-up">
                            <div className="flex justify-end">
                                <button 
                                    onClick={() => setShowTaxiModal(false)}
                                    className="px-6 py-3 bg-stone-800 text-white rounded-2xl font-bold text-sm active-scale"
                                >
                                    닫기 ✕
                                </button>
                            </div>

                            <div className="space-y-6 my-auto max-w-xl mx-auto">
                                <span className="text-sm font-bold text-amber-400 tracking-widest uppercase">運転手さん、ここまでお願いします</span>
                                <h1 className="text-3xl sm:text-5xl font-black text-white font-serif border-b border-stone-800 pb-6 leading-tight">
                                    {selectedSpot.jpName}
                                </h1>
                                <div className="bg-stone-950 p-6 rounded-3xl border border-stone-800 space-y-2">
                                    <span className="text-xs text-stone-500">住所 (주소)</span>
                                    <p className="text-xl sm:text-3xl font-bold text-amber-300 font-serif leading-relaxed">
                                        {selectedSpot.jpAddress}
                                    </p>
                                </div>
                            </div>

                            <p className="text-xs text-stone-500">기사님께 이 화면을 보여주시면 목적지까지 손쉽게 이동할 수 있습니다.</p>
                        </div>
                    )}

                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-stone-900/90 dark:bg-stone-900/90 light:bg-white/90 backdrop-blur-2xl border border-stone-800/90 dark:border-stone-800/90 light:border-stone-200/90 rounded-full px-6 py-3.5 shadow-glass-dark dark:shadow-glass-dark light:shadow-glass-light flex items-center space-x-7 sm:space-x-9">
                        <button 
                            onClick={() => setActiveTab('explore')}
                            className={`flex flex-col items-center space-y-1 transition-transform ${activeTab === 'explore' ? 'text-gold font-bold scale-110' : 'text-stone-500 hover:text-stone-300'}`}
                        >
                            <i className="fa-solid fa-compass text-lg"></i>
                            <span className="text-[10px]">탐색</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('phrases')}
                            className={`flex flex-col items-center space-y-1 transition-transform ${activeTab === 'phrases' ? 'text-gold font-bold scale-110' : 'text-stone-500 hover:text-stone-300'}`}
                        >
                            <i className="fa-solid fa-comments text-lg"></i>
                            <span className="text-[10px]">회화집</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('passport')}
                            className={`flex flex-col items-center space-y-1 transition-transform ${activeTab === 'passport' ? 'text-vermilion font-bold scale-110' : 'text-stone-500 hover:text-stone-300'}`}
                        >
                            <i className="fa-solid fa-passport text-lg"></i>
                            <span className="text-[10px]">여권</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('calc')}
                            className={`flex flex-col items-center space-y-1 transition-transform ${activeTab === 'calc' ? 'text-gold font-bold scale-110' : 'text-stone-500 hover:text-stone-300'}`}
                        >
                            <i className="fa-solid fa-calculator text-lg"></i>
                            <span className="text-[10px]">엔화계산</span>
                        </button>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
