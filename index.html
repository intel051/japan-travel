        const speakJapanese = (text) => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.split('(')[0].trim();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        };

            const [filterStatus, setFilterStatus] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [activeTab, setActiveTab] = useState('explore'); // 'explore' | 'phrases' | 'passport' | 'calc'
            const [selectedSpot, setSelectedSpot] = useState(null);
            const [showTaxiModal, setShowTaxiModal] = useState(false);
            const [toast, setToast] = useState('');
            const [copiedId, setCopiedId] = useState(null);

            // Currency Converter State
            const [yenInput, setYenInput] = useState('1000');
            const yenRate = 8.95;

            // LocalStorage Bookmarks
            const [bookmarks, setBookmarks] = useState(() => {
                try {
                    const saved = localStorage.getItem('tabi_gourmet_bookmarks_v4');
                    return saved ? JSON.parse(saved) : ['tokyo-ramen-1', 'osaka-okonomiyaki-1'];
                } catch { return ['tokyo-ramen-1']; }
            });

            useEffect(() => {
                try {
                    localStorage.setItem('tabi_gourmet_bookmarks_v4', JSON.stringify(bookmarks));
                } catch (e) { console.error(e); }
            }, [bookmarks]);

            const toggleTheme = () => {
                setIsDarkMode(!isDarkMode);
                document.documentElement.classList.toggle('dark');
            };

            const triggerToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 2500);
            };

            const toggleBookmark = (spot, e) => {
                if (e) e.stopPropagation();
                const exists = bookmarks.includes(spot.id);
                if (exists) {
                    setBookmarks(bookmarks.filter(id => id !== spot.id));
                    triggerToast('🔖 미식 여권에서 삭제되었습니다.');
                } else {
                    setBookmarks([...bookmarks, spot.id]);
                    triggerToast('🌸 미식 여권에 저장되었습니다!');
                }
            };

            const searchRestaurants = async (e) => {
                if (e) e.preventDefault();
                document.activeElement?.blur();

                setLoading(true);
                setError('');

                try {
                    // Try calling backend API (/api/search) first
                    const res = await fetch('/api/search', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ city: city.trim(), food: food.trim() }),
                    });

                    if (res.ok) {
                        const data = await res.json();
                        if (data.results && data.results.length > 0) {
                            setResults(data.results.map((p, idx) => ({
                                id: p.id || `api-spot-${idx}`,
                                name: p.name || `${city} ${food} 맛집`,
                                jpName: p.japaneseName || p.name,
                                city: city || '일본',
                                district: p.district || '주요지역',
                                category: food || '맛집',
                                rating: p.rating || 4.5,
                                reviewCount: p.reviewCount || 120,
                                price: p.price || '¥1,000 - ¥3,000',
                                hours: p.hours || '영업시간 매장 문의',
                                address: p.address || '주소 정보',
                                jpAddress: p.japaneseAddress || p.address,
                                tags: p.tags || ['구글검증', '실시간데이터'],
                                description: p.description || `${city}에서 만나는 인기의 ${food} 전문 레스토랑.`,
                                signatureDishes: p.signatureDishes || [`추천 ${food} 메뉴`]
                            })));
                            setFilterStatus(data.filterStatus || '실시간 API 결과');
                            setLoading(false);
                            return;
                        }
                    }
                    throw new Error("API_FALLBACK");

                } catch (err) {
                    // Fallback to local filtering if /api/search API is not present/fails
                    await new Promise(r => setTimeout(r, 450));
                    const targetCity = city.trim().toLowerCase();
                    const targetFood = food.trim().toLowerCase();

                    const filtered = JAPAN_GOURMET_DB.filter(spot => {
                        const matchCity = !targetCity || spot.city.toLowerCase().includes(targetCity) || spot.district.toLowerCase().includes(targetCity);
                        const matchFood = !targetFood || spot.category.toLowerCase().includes(targetFood) || spot.name.toLowerCase().includes(targetFood) || spot.tags.some(t => t.toLowerCase().includes(targetFood));
                        return matchCity && matchFood;
                    });

                    if (filtered.length > 0) {
                        setResults(filtered);
                        setFilterStatus('추천 데이터 필터 적용');
                    } else {
                        setResults(JAPAN_GOURMET_DB);
                        setFilterStatus('전체 추천 목록');
                    }
                    setLoading(false);
                }
            };

            const copyToClipboard = (text, id) => {
                navigator.clipboard.writeText(text);
                setCopiedId(id);
                triggerToast('📋 일본어 주소가 복사되었습니다.');
                setTimeout(() => setCopiedId(null), 2000);
            };

            const savedSpotObjects = useMemo(() => {
                return JAPAN_GOURMET_DB.filter(spot => bookmarks.includes(spot.id));
            }, [bookmarks]);

            return (
                <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 relative z-10 min-h-screen flex flex-col">
                    
                    {/* Toast Notification Alert */}
                    {toast && (
                        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-japandi-text dark:bg-tokyonight-card text-japandi-bg dark:text-tokyonight-text text-xs sm:text-sm font-bold px-5 py-3 rounded-full shadow-2xl flex items-center space-x-2.5 border border-japandi-accent/40 dark:border-tokyonight-gold/40 animate-bounce">
                            <i className="fa-solid fa-wand-magic-sparkles text-japandi-accent dark:text-tokyonight-gold"></i>
                            <span>{toast}</span>
                        </div>
                    )}

                    {/* HEADER NAVIGATION */}
                    {}
                    <header className="flex items-center justify-between pb-6 border-b border-japandi-border/80 dark:border-tokyonight-border/80 mb-8">
                        <div className="flex items-center space-x-3 cursor-pointer group" onClick={() => { setActiveTab('explore'); setCity(''); setFood(''); setResults(JAPAN_GOURMET_DB); }}>
                            <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-vermilion via-red-600 to-amber-600 text-white flex items-center justify-center shadow-lg group-hover:scale-105 active-scale">
                                <i className="fa-solid fa-torii-gate text-lg"></i>
                            </div>
                            <div>
                                <div className="flex items-center space-x-2">
                                    <span className="font-extrabold text-xl tracking-tight">일여방</span>
                                    <span className="text-[10px] font-extrabold tracking-wider text-vermilion bg-vermilion-soft border border-vermilion/30 px-2 py-0.5 rounded-full uppercase">
                                        日旅食
                                    </span>
                                </div>
                                <p className="text-[11px] text-japandi-muted dark:text-tokyonight-muted font-medium">일본 미식 여행 가이드</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2">
                            {/* Theme Toggle Button */}
                            <button
                                onClick={toggleTheme}
                                className="px-3.5 py-2 rounded-xl bg-japandi-card dark:bg-tokyonight-card text-japandi-text dark:text-tokyonight-gold border border-japandi-border dark:border-tokyonight-border flex items-center space-x-2 active-scale text-xs font-bold shadow-washi dark:shadow-night"
                            >
                                <i className={`fa-solid ${isDarkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-600'}`}></i>
                                <span className="hidden sm:inline">{isDarkMode ? '도쿄 야경' : '료칸 와시'}</span>
                            </button>

                            {/* Gourmet Passport Tab Button */}
                            <button
                                onClick={() => setActiveTab('passport')}
                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-2 active-scale ${
                                    activeTab === 'passport'
                                        ? 'bg-vermilion text-white shadow-lg'
                                        : 'bg-japandi-card dark:bg-tokyonight-card text-japandi-text dark:text-tokyonight-text border border-japandi-border dark:border-tokyonight-border'
                                }`}
                            >
                                <i className="fa-solid fa-passport"></i>
                                <span className="hidden sm:inline">미식 여권</span>
                                {bookmarks.length > 0 && (
                                    <span className="px-1.5 py-0.2 text-[10px] rounded-full bg-japandi-accent dark:bg-tokyonight-gold text-white dark:text-tokyonight-bg font-black">
                                        {bookmarks.length}
                                    </span>
                                )}
                            </button>
                        </div>
                    </header>

                    {/* MAIN TAB 1: EXPLORE GOURMET SPOTS */}
                    {}
                    {activeTab === 'explore' && (
                        <div className="space-y-8 animate-slide-up">
                            
                            {/* Torii Hero Banner */}
                            <div className="relative overflow-hidden rounded-3xl bg-japandi-card dark:bg-tokyonight-card p-6 sm:p-10 border border-japandi-border/80 dark:border-tokyonight-border/80 shadow-washi dark:shadow-night">
                                <div className="absolute -top-10 -right-8 text-[140px] sm:text-[180px] font-black text-japandi-text/5 dark:text-white/5 pointer-events-none select-none">
                                    食
                                </div>
                                <div className="relative z-10 max-w-2xl space-y-3">
                                    <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-vermilion-soft border border-vermilion/30 text-vermilion text-xs font-extrabold">
                                        <div className="w-2 h-2 rounded-full bg-vermilion pulse-lantern"></div>
                                        <span>JAPAN GOURMET</span>
                                    </div>
                                    <h1 className="text-2xl sm:text-4xl font-extrabold leading-tight tracking-tight">
                                        일본 어디서<br />
                                        <span className="text-vermilion dark:text-tokyonight-gold">
                                            미식을 즐기시나요?
                                        </span>
                                    </h1>
                                    <p className="text-xs sm:text-sm text-japandi-muted dark:text-tokyonight-muted leading-relaxed font-medium">
                                        구글 평점과 현지인 후기로 검증된 맛집 검색. 1초 일어 음성 지원, 택시 기사님 전용 빅폰트 화면, 실전 회화 가이드가 제공됩니다.
                                    </p>
                                </div>
                            </div>

                            {/* Search Dashboard Card */}
                            <div className="bg-japandi-card dark:bg-tokyonight-card p-5 sm:p-7 rounded-3xl space-y-6 border border-japandi-border/80 dark:border-tokyonight-border/80 shadow-washi dark:shadow-night">
                                <form onSubmit={searchRestaurants} className="space-y-5">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {/* City Input */}
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-japandi-muted dark:text-tokyonight-muted flex items-center space-x-1.5">
                                                <i className="fa-solid fa-location-dot text-vermilion"></i>
                                                <span>여행 도시</span>
                                            </label>
                                            <div className="relative">
                                                <input 
                                                    type="text"
                                                    value={city}
                                                    onChange={e => setCity(e.target.value)}
                                                    placeholder="도시 (예: 도쿄, 오사카, 후쿠오카)"
                                                    className="w-full bg-japandi-bg dark:bg-tokyonight-bg border border-japandi-border dark:border-tokyonight-border rounded-2xl py-3.5 pl-11 pr-4 text-sm font-semibold focus:outline-none focus:border-vermilion transition-all"
                                                />
                                                <i className="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-japandi-muted dark:text-tokyonight-muted text-xs"></i>
                                            </div>
                                        </div>

                                        {/* Food Input */}
                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-japandi-muted dark:text-tokyonight-muted flex items-center space-x-1.5">
                                                <i className="fa-solid fa-utensils text-japandi-accent dark:text-tokyonight-gold"></i>
                                                <span>메뉴 또는 음식</span>
                                            </label>
                                            <div className="relative">
                                                <input 
                                                    type="text"
                                                    value={food}
                                                    onChange={e => setFood(e.target.value)}
                                                    placeholder="메뉴 (예: 라멘, 스시, 돈카츠)"
                                                    className="w-full bg-japandi-bg dark:bg-tokyonight-bg border border-japandi-border dark:border-tokyonight-border rounded-2xl py-3.5 pl-11 pr-4 text-sm font-semibold focus:outline-none focus:border-vermilion transition-all"
                                                />
                                                <i className="fa-solid fa-bowl-food absolute left-4 top-1/2 -translate-y-1/2 text-japandi-muted dark:text-tokyonight-muted text-xs"></i>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Quick Chips Filter */}
                                    <div className="space-y-2 pt-1">
                                        <span className="text-[11px] font-bold text-japandi-muted dark:text-tokyonight-muted tracking-wider uppercase block">
                                            ⚡ 주요 도시 빠른 선택
                                        </span>
                                        <div className="flex flex-wrap gap-2">
                                            {['전체', '도쿄', '오사카', '교토', '후쿠오카', '삿포로'].map(c => (
                                                <button
                                                    key={c}
                                                    type="button"
                                                    onClick={() => { setCity(c === '전체' ? '' : c); }}
                                                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all active-scale ${
                                                        (city === c || (c === '전체' && !city))
                                                            ? 'bg-vermilion text-white shadow-md'
                                                            : 'bg-japandi-bg dark:bg-tokyonight-bg text-japandi-muted dark:text-tokyonight-muted border border-japandi-border dark:border-tokyonight-border'
                                                    }`}
                                                >
                                                    {c}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Submit Button */}
                                    <button 
                                        type="submit"
                                        disabled={loading}
                                        className="w-full py-4 bg-vermilion hover:bg-vermilion-hover text-white font-extrabold rounded-2xl text-sm shadow-lg flex items-center justify-center space-x-2 active-scale transition-all"
                                    >
                                        {loading ? (
                                            <>
                                                <i className="fa-solid fa-circle-notch animate-spin"></i>
                                                <span>검색 중...</span>
                                            </>
                                        ) : (
                                            <>
                                                <i className="fa-solid fa-magnifying-glass"></i>
                                                <span>맛집 검색하기</span>
                                                <i className="fa-solid fa-arrow-right text-xs"></i>
                                            </>
                                        )}
                                    </button>
                                </form>
                            </div>

                            {/* Gourmet Spot Grid */}
                            {}
                            <div className="space-y-4">
                                <div className="flex items-center justify-between text-xs text-japandi-muted dark:text-tokyonight-muted px-1 font-bold">
                                    <span>
                                        검색 결과 <strong className="text-vermilion dark:text-tokyonight-gold font-extrabold">{results.length}</strong>곳
                                    </span>
                                    {filterStatus && <span className="text-[11px] bg-vermilion-soft text-vermilion px-2.5 py-0.5 rounded-full">{filterStatus}</span>}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                    {results.map((spot) => {
                                        const isSaved = bookmarks.includes(spot.id);
                                        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${spot.name} ${spot.address}`)}`;

                                        return (
                                            <div 
                                                key={spot.id}
                                                onClick={() => setSelectedSpot(spot)}
                                                className="bg-japandi-card dark:bg-tokyonight-card rounded-3xl p-5 flex flex-col justify-between cursor-pointer group relative overflow-hidden border border-japandi-border/90 dark:border-tokyonight-border/90 shadow-washi dark:shadow-night active-scale hover:border-vermilion/50 transition-all"
                                            >
                                                <div>
                                                    <div className="flex items-start justify-between gap-2 mb-2">
                                                        <span className="text-[10px] font-extrabold px-2.5 py-0.5 rounded-md bg-japandi-bg dark:bg-tokyonight-bg text-japandi-text dark:text-tokyonight-text border border-japandi-border dark:border-tokyonight-border">
                                                            {spot.city} • {spot.district}
                                                        </span>

                                                        <button
                                                            onClick={(e) => toggleBookmark(spot, e)}
                                                            className={`w-9 h-9 rounded-full flex items-center justify-center transition-colors active-scale shrink-0 ${
                                                                isSaved 
                                                                    ? 'bg-vermilion/15 text-vermilion border border-vermilion/30' 
                                                                    : 'bg-japandi-bg dark:bg-tokyonight-bg text-japandi-muted dark:text-tokyonight-muted border border-japandi-border dark:border-tokyonight-border'
                                                            }`}
                                                        >
                                                            <i className={`fa-solid fa-heart ${isSaved ? 'text-vermilion' : ''}`}></i>
                                                        </button>
                                                    </div>

                                                    <h3 className="text-base font-extrabold group-hover:text-vermilion dark:group-hover:text-tokyonight-gold transition-colors leading-snug">
                                                        {spot.name}
                                                    </h3>
                                                    <p className="text-xs text-japandi-muted dark:text-tokyonight-muted font-medium mb-3">{spot.jpName}</p>

                                                    <div className="flex items-center space-x-3 mb-3 text-xs">
                                                        <div className="flex items-center bg-amber-500/15 border border-amber-500/30 px-2 py-0.5 rounded-xl text-amber-600 dark:text-amber-400 font-extrabold">
                                                            <i className="fa-solid fa-star text-amber-500 mr-1 text-[10px]"></i>
                                                            <span>{spot.rating}</span>
                                                        </div>
                                                        <span className="text-japandi-muted dark:text-tokyonight-muted text-[11px]">리뷰 {spot.reviewCount?.toLocaleString()}개</span>
                                                    </div>

                                                    <p className="text-xs text-japandi-muted dark:text-tokyonight-muted leading-relaxed line-clamp-2 mb-3">
                                                        {spot.description}
                                                    </p>
                                                </div>

                                                <div className="pt-3 border-t border-japandi-border/80 dark:border-tokyonight-border/80 flex items-center justify-between gap-2 text-xs">
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); speakJapanese(spot.jpName); }}
                                                        className="p-2.5 rounded-xl bg-japandi-bg dark:bg-tokyonight-bg text-japandi-accent dark:text-tokyonight-gold border border-japandi-border dark:border-tokyonight-border active-scale"
                                                        title="일본어 발음 오디오 들기"
                                                    >
                                                        <i className="fa-solid fa-volume-high"></i>
                                                    </button>

                                                    <button
                                                        onClick={(e) => { e.stopPropagation(); copyToClipboard(spot.jpAddress, spot.id); }}
                                                        className="flex-1 py-2.5 px-3 rounded-xl bg-japandi-bg dark:bg-tokyonight-bg text-japandi-text dark:text-tokyonight-text font-semibold border border-japandi-border dark:border-tokyonight-border flex items-center justify-center space-x-1.5 active-scale"
                                                    >
                                                        <i className="fa-regular fa-copy text-japandi-muted"></i>
                                                        <span>{copiedId === spot.id ? '복사 완료' : '주소 복사'}</span>
                                                    </button>

                                                    <a
                                                        href={mapUrl}
                                                        target="_blank"
                                                        rel="noreferrer"
                                                        onClick={(e) => e.stopPropagation()}
                                                        className="flex-1 py-2.5 px-3 rounded-xl bg-vermilion text-white font-bold flex items-center justify-center space-x-1.5 shadow-md active-scale"
                                                    >
                                                        <span>구글 맵</span>
                                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                    </a>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                        </div>
                    )}

                    {/* MAIN TAB 2: JAPANESE DINING PHRASEBOOK */}
                    {}
                    {activeTab === 'phrases' && (
                        <div className="space-y-6 animate-slide-up">
                            <div className="bg-japandi-card dark:bg-tokyonight-card rounded-3xl p-6 sm:p-8 space-y-2 border border-japandi-border dark:border-tokyonight-border">
                                <span className="text-xs font-bold text-vermilion uppercase tracking-wider">JAPANESE DINING PHRASES</span>
                                <h2 className="text-2xl font-extrabold">현지 식당 필수 회화 가이드</h2>
                                <p className="text-xs text-japandi-muted dark:text-tokyonight-muted">스피커 버튼을 누르면 원어민 일본어 오디오 발음이 재생됩니다.</p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                {DINING_PHRASEBOOK.map((phrase, pIdx) => (
                                    <div key={pIdx} className="bg-japandi-card dark:bg-tokyonight-card rounded-2xl p-5 space-y-3 border border-japandi-border dark:border-tokyonight-border">
                                        <div className="flex items-center justify-between">
                                            <span className="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-vermilion-soft text-vermilion">
                                                {phrase.category}
                                            </span>
                                            <button 
                                                onClick={() => speakJapanese(phrase.jp)}
                                                className="w-8 h-8 rounded-full bg-japandi-bg dark:bg-tokyonight-bg text-vermilion border border-japandi-border dark:border-tokyonight-border flex items-center justify-center active-scale"
                                            >
                                                <i className="fa-solid fa-volume-high text-xs"></i>
                                            </button>
                                        </div>

                                        <p className="text-base font-extrabold leading-snug">{phrase.jp}</p>
                                        <p className="text-xs text-vermilion font-bold">{phrase.ko}</p>
                                        <p className="text-[11px] text-japandi-muted dark:text-tokyonight-muted bg-japandi-bg dark:bg-tokyonight-bg p-2.5 rounded-xl border border-japandi-border dark:border-tokyonight-border">
                                            💡 {phrase.tip}
                                        </p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* MAIN TAB 3: GOURMET PASSPORT (BOOKMARKS) */}
                    {}
                    {activeTab === 'passport' && (
                        <div className="space-y-6 animate-slide-up">
                            <div className="bg-japandi-card dark:bg-tokyonight-card rounded-3xl p-6 sm:p-8 space-y-2 border border-japandi-border dark:border-tokyonight-border">
                                <span className="text-xs font-bold text-vermilion uppercase tracking-wider">MY GOURMET PASSPORT</span>
                                <h2 className="text-2xl font-extrabold">나의 일본 미식 여권</h2>
                                <p className="text-xs text-japandi-muted dark:text-tokyonight-muted">
                                    저장한 맛집 목록 <strong className="text-vermilion font-bold">{savedSpotObjects.length}곳</strong>
                                </p>
                            </div>

                            {savedSpotObjects.length === 0 ? (
                                <div className="bg-japandi-card dark:bg-tokyonight-card rounded-3xl p-12 text-center space-y-4 border border-japandi-border dark:border-tokyonight-border">
                                    <i className="fa-solid fa-passport text-4xl text-japandi-muted"></i>
                                    <p className="text-sm text-japandi-muted">아직 저장한 미식 스폿이 없습니다.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {savedSpotObjects.map((spot) => (
                                        <div key={spot.id} className="bg-japandi-card dark:bg-tokyonight-card rounded-3xl p-5 space-y-4 border border-japandi-border dark:border-tokyonight-border">
                                            <div className="flex items-start justify-between">
                                                <div>
                                                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-japandi-bg dark:bg-tokyonight-bg">
                                                        {spot.city} • {spot.district}
                                                    </span>
                                                    <h3 className="text-base font-bold mt-1">{spot.name}</h3>
                                                    <p className="text-xs text-japandi-muted font-medium">{spot.jpName}</p>
                                                </div>
                                                <button onClick={(e) => toggleBookmark(spot, e)} className="text-vermilion p-2 active-scale">
                                                    <i className="fa-solid fa-heart"></i>
                                                </button>
                                            </div>

                                            <div className="flex items-center space-x-2 text-xs">
                                                <button
                                                    onClick={() => { setSelectedSpot(spot); setShowTaxiModal(true); }}
                                                    className="flex-1 py-2.5 bg-japandi-bg dark:bg-tokyonight-bg font-bold rounded-xl border border-japandi-border dark:border-tokyonight-border flex items-center justify-center space-x-1 active-scale"
                                                >
                                                    <i className="fa-solid fa-taxi text-vermilion"></i>
                                                    <span>택시 보드</span>
                                                </button>
                                                <a
                                                    href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${spot.name} ${spot.address}`)}`}
                                                    target="_blank"
                                                    rel="noreferrer"
                                                    className="flex-1 py-2.5 bg-vermilion text-white font-bold rounded-xl text-center shadow-md active-scale"
                                                >
                                                    구글 맵
                                                </a>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* MAIN TAB 4: YEN CONVERTER */}
                    {}
                    {activeTab === 'calc' && (
                        <div className="space-y-6 animate-slide-up max-w-xl mx-auto">
                            <div className="bg-japandi-card dark:bg-tokyonight-card rounded-3xl p-6 sm:p-8 space-y-4 border border-japandi-border dark:border-tokyonight-border">
                                <span className="text-xs font-bold text-vermilion uppercase tracking-wider">YEN CONVERTER</span>
                                <h2 className="text-2xl font-extrabold">엔화 ↔ 원화 1초 환율 계산기</h2>

                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-japandi-muted mb-1 block">일본 엔화 (¥)</label>
                                        <input 
                                            type="number"
                                            value={yenInput}
                                            onChange={e => setYenInput(e.target.value)}
                                            className="w-full bg-japandi-bg dark:bg-tokyonight-bg border border-japandi-border dark:border-tokyonight-border rounded-2xl p-4 text-xl font-extrabold focus:outline-none focus:border-vermilion"
                                        />
                                    </div>

                                    <div className="p-5 rounded-2xl bg-vermilion-soft border border-vermilion/30 text-center space-y-1">
                                        <span className="text-xs text-japandi-muted font-bold block">예상 원화 결제 금액</span>
                                        <p className="text-3xl font-black text-vermilion">
                                            ₩ {Math.round((parseFloat(yenInput) || 0) * (yenRate / 10)).toLocaleString()} 원
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SPOT DETAIL MODAL */}
                    {}
                    {selectedSpot && !showTaxiModal && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 animate-slide-up" onClick={() => setSelectedSpot(null)}>
                            <div className="bg-japandi-card dark:bg-tokyonight-card max-w-lg w-full rounded-3xl p-6 sm:p-8 space-y-6 border border-japandi-border dark:border-tokyonight-border relative shadow-2xl" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelectedSpot(null)} className="absolute top-5 right-5 w-8 h-8 rounded-full bg-japandi-bg dark:bg-tokyonight-bg flex items-center justify-center">
                                    ✕
                                </button>

                                <div>
                                    <span className="text-xs font-bold text-vermilion">{selectedSpot.city} • {selectedSpot.district}</span>
                                    <h2 className="text-2xl font-extrabold mt-1">{selectedSpot.name}</h2>
                                    <p className="text-xs text-japandi-muted font-medium mt-0.5">{selectedSpot.jpName}</p>
                                </div>

                                <div className="space-y-2 text-xs">
                                    <div className="bg-japandi-bg dark:bg-tokyonight-bg p-3.5 rounded-2xl border border-japandi-border dark:border-tokyonight-border space-y-1">
                                        <p className="font-bold text-japandi-muted">📍 현지 일어 주소</p>
                                        <p className="font-semibold">{selectedSpot.jpAddress}</p>
                                    </div>
                                    <div className="bg-japandi-bg dark:bg-tokyonight-bg p-3.5 rounded-2xl border border-japandi-border dark:border-tokyonight-border space-y-1">
                                        <p className="font-bold text-japandi-muted">⏰ 영업시간</p>
                                        <p>{selectedSpot.hours}</p>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2">
                                    <button onClick={() => setShowTaxiModal(true)} className="py-3 px-4 bg-japandi-bg dark:bg-tokyonight-bg font-bold text-xs rounded-2xl border border-japandi-border dark:border-tokyonight-border active-scale">
                                        🚖 택시 보드
                                    </button>
                                    <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${selectedSpot.name} ${selectedSpot.address}`)}`} target="_blank" rel="noreferrer" className="flex-1 py-3 bg-vermilion text-white font-bold text-xs rounded-2xl text-center shadow-md active-scale">
                                        구글 맵으로 길찾기
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAXI DRIVER DISPLAY BOARD OVERLAY */}
                    {}
                    {showTaxiModal && selectedSpot && (
                        <div className="fixed inset-0 z-50 bg-black flex flex-col justify-between p-6 text-center animate-slide-up">
                            <div className="flex justify-end">
                                <button onClick={() => setShowTaxiModal(false)} className="px-5 py-2.5 bg-stone-800 text-white rounded-xl font-bold text-xs">
                                    닫기 ✕
                                </button>
                            </div>

                            <div className="space-y-6 my-auto">
                                <span className="text-xs font-bold text-amber-400">運転手さん、ここまでお願いします</span>
                                <h1 className="text-3xl sm:text-5xl font-black text-white border-b border-stone-800 pb-6 leading-tight">
                                    {selectedSpot.jpName}
                                </h1>
                                <p className="text-xl sm:text-3xl font-extrabold text-amber-300">
                                    {selectedSpot.jpAddress}
                                </p>
                            </div>

                            <p className="text-xs text-stone-500 font-medium">기사님께 이 화면을 보여주시면 목적지까지 손쉽게 이동할 수 있습니다.</p>
                        </div>
                    )}

                    {/* FLOATING BOTTOM DOCK NAVIGATION */}
                    {}
                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 bg-japandi-card/90 dark:bg-tokyonight-card/90 backdrop-blur-2xl border border-japandi-border dark:border-tokyonight-border rounded-full px-6 py-3.5 shadow-2xl flex items-center space-x-8">
                        <button onClick={() => setActiveTab('explore')} className={`flex flex-col items-center space-y-1 active-scale ${activeTab === 'explore' ? 'text-vermilion font-black' : 'text-japandi-muted'}`}>
                            <i className="fa-solid fa-compass text-lg"></i>
                            <span className="text-[10px]">탐색</span>
                        </button>
                        <button onClick={() => setActiveTab('phrases')} className={`flex flex-col items-center space-y-1 active-scale ${activeTab === 'phrases' ? 'text-vermilion font-black' : 'text-japandi-muted'}`}>
                            <i className="fa-solid fa-comments text-lg"></i>
                            <span className="text-[10px]">회화</span>
                        </button>
                        <button onClick={() => setActiveTab('passport')} className={`flex flex-col items-center space-y-1 active-scale ${activeTab === 'passport' ? 'text-vermilion font-black' : 'text-japandi-muted'}`}>
                            <i className="fa-solid fa-passport text-lg"></i>
                            <span className="text-[10px]">여권</span>
                        </button>
                        <button onClick={() => setActiveTab('calc')} className={`flex flex-col items-center space-y-1 active-scale ${activeTab === 'calc' ? 'text-vermilion font-black' : 'text-japandi-muted'}`}>
                            <i className="fa-solid fa-calculator text-lg"></i>
                            <span className="text-[10px]">엔화계산</span>
                        </button>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
